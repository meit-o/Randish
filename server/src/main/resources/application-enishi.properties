spring.application.name=enishi
server.address=${ENISHI_SERVER_ADDRESS:127.0.0.1}
server.port=${ENISHI_PORT:8085}
spring.datasource.url=${ENISHI_DATABASE_URL:jdbc:h2:file:./data/enishi;MODE=PostgreSQL;DATABASE_TO_UPPER=false}
spring.datasource.username=${ENISHI_DATABASE_USER:sa}
spring.datasource.password=${ENISHI_DATABASE_PASSWORD:}
spring.sql.init.schema-locations=classpath:enishi-schema.sql
enishi.checkin-radius-meters=${ENISHI_CHECKIN_RADIUS_METERS:150}
enishi.visit-hours=${ENISHI_VISIT_HOURS:4}
enishi.demo.enabled=${ENISHI_DEMO_ENABLED:false}
enishi.secure-cookie=${ENISHI_SECURE_COOKIE:false}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
